# conda-forge recipe (v1 format) for the sinapse-sdk meta-package.
# Reference copy — the authoritative copy lives in the conda-forge
# feedstock (conda-forge/sinapse-sdk-feedstock). `conda install
# sinapse-sdk` pulls a mutually compatible component set.
schema_version: 1

context:
  name: sinapse-sdk
  version: "0.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/sinapse-sdk/sinapse_sdk-${{ version }}.tar.gz
  sha256: df6137af9ff98df8d001801b6063bd13c917b20762ce708ef8e749e89f5264cf

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    # meta-package: pulls the SDK component packages
    - python >=${{ python_min }}
    - rhapsody-py >=0.5.0
    - radical.asyncflow >=0.5.0
    - quacc
    - rootstock
    - ddsim >=0.2.1
    # conda-only component: seekrflow depends on seekr and OpenMM, which
    # have no PyPI packages
    - seekrflow >=3.1.4
    # conda-only component: Flux backend for RHAPSODY (no PyPI package;
    # linux-only builds)
    - flux-core
    # workaround: conda-forge pymatgen 2026.9.24 (builds 0 and 1) ships pip
    # metadata "Version: 0.0.0" and breaks pip check via emmet-core
    # (conda-forge/pymatgen-feedstock#203); drop once a fixed build lands
    - pymatgen !=2026.9.24

# meta-package installs no module of its own, so no import test
tests:
  - python:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: http://project-sinapse.org
  summary: SINAPSE SDK — curated software components for AI-coupled HPC workflows
  description: |
    The SINAPSE SDK is a curated collection of software components for
    AI-coupled HPC workflows (NSF award 2514139). This meta-package
    installs a mutually compatible set of the released components:
    RHAPSODY (rhapsody-py), AsyncFlow (radical.asyncflow), QuAcc,
    Rootstock, DeepDriveSim (ddsim), and Seekrflow, plus flux-core for
    RHAPSODY's Flux backend. Seekrflow and Flux are conda-only, so the
    conda package is a superset of the PyPI meta-package. The Dragon
    backend for RHAPSODY is PyPI-only: `pip install dragonhpc` into the
    conda env.
  license: MIT
  license_file: LICENSE
  documentation: https://sinapse-sdk.readthedocs.io/
  repository: https://github.com/SINAPSE-NSF/sinapse-sdk

extra:
  recipe-maintainers:
    - andre-merzky
