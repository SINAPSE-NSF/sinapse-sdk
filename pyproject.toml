[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sinapse-sdk"
description = "SINAPSE SDK — curated software components for AI-coupled HPC workflows"
dynamic = ["version", "dependencies"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "The SINAPSE project"}
]

[project.urls]
Homepage = "http://project-sinapse.org"
Repository = "https://github.com/SINAPSE-NSF/sinapse-sdk"

# meta-package: ships no code, only the dependency set
[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = {file = "VERSION"}
dependencies = {file = "requirements.txt"}
